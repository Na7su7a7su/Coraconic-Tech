# 核龙科技 / Coraconic Tech
# NeoForge 1.21.1 mod metadata.

modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="Aestastel"
description='''
Coraconic Tech is an early-development NeoForge tech mod for Minecraft 1.21.1.
It focuses on tin, lead, coraconic metal, aviraconic metal, their tools, crystals, and future processing content.

核龙科技是面向 Minecraft 1.21.1 / NeoForge 的早期开发科技模组。
内容围绕锡、铅、核龙金属、腾龙金属及其工具、晶体与后续加工体系展开。
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
